name: Validate PluginMaster

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pluginmaster:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate manifest and release assets
        shell: pwsh
        run: ./tools/Test-PluginMaster.ps1
